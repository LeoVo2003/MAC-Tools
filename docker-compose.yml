services:
  fugt:
    image: ghcr.io/leovo2003/user-guide:latest
    build: .
    ports:
      - "3847:3847"
    # Idle mặc định 0.3 — app scale lên DOCKER_CPU_LIVE khi Mở Live (cần docker.sock)
    cpus: "0.30"
    shm_size: "512m"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      OPEN_BROWSER: "false"
      HEADLESS: ${HEADLESS:-false}
      CHROME_LIVE: ${CHROME_LIVE:-true}
      CHROME_LIVE_MODE: ${CHROME_LIVE_MODE:-novnc}
      DISPLAY: ${DISPLAY:-:99}
      CHROME_PATH: ${CHROME_PATH:-/usr/bin/chromium}
      CHROME_NO_SANDBOX: ${CHROME_NO_SANDBOX:-true}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      PORT: ${PORT:-3847}
      SPEED: ${SPEED:-fast}
      COOKIE_SECURE: ${COOKIE_SECURE:-auto}
      DOWNLOAD_DIR: ${DOWNLOAD_DIR:-/data/downloads}
      NOVNC_PATH: ${NOVNC_PATH:-/usr/share/novnc}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      DOCKER_CPU_SCALE: ${DOCKER_CPU_SCALE:-true}
      DOCKER_CPU_IDLE: ${DOCKER_CPU_IDLE:-0.3}
      DOCKER_CPU_LIVE: ${DOCKER_CPU_LIVE:-1.5}
    volumes:
      - fugt_downloads:/data/downloads
      - fugt_data:/app/data
      - fugt_errors:/app/errors
      # Cho phép docker update --cpus khi Mở/Đóng Live (idle 0.3 ↔ live 1.5)
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3847/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  fugt_downloads:
  fugt_data:
  fugt_errors:
