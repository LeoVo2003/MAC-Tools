services:
  fugt:
    image: ghcr.io/leovo2003/user-guide:latest
    build: .
    ports:
      - "3847:3847"
    environment:
      NODE_ENV: production
      OPEN_BROWSER: "false"
      HEADLESS: "true"
      CHROME_PATH: /usr/bin/chromium
      CHROME_NO_SANDBOX: "true"
      PORT: "3847"
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      APP_SECRET: ${APP_SECRET:?set APP_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DOWNLOAD_DIR: /data/downloads
    volumes:
      - fugt_downloads:/data/downloads
      - fugt_data:/app/data
    restart: unless-stopped

volumes:
  fugt_downloads:
  fugt_data:
