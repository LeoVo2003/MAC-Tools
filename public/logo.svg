    <path fill-rule="evenodd" d="M 0,-54 A 54,54 0 1,0 0,54 A 54,54 0 1,0 0,-54 Z M 26,0 L 13,22.52 L -13,22.52 L -26,0 L -13,-22.52 L 13,-22.52 Z"/>
  </g>

  <!-- Wordmark -->
  <text x="215" y="142" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="96" letter-spacing="-2">
    <tspan fill="#FFFFFF">MAC</tspan><tspan dx="18" fill="url(#brandGrad)">Tools</tspan>
  </text>
