      <stop offset="0" stop-color="#E31E24"/>
      <stop offset="1" stop-color="#FF6A2C"/>
    </linearGradient>
  </defs>

  <!-- Gear mark -->
  <g fill="url(#brandGrad)" transform="translate(110,110)">
    <g>
      <rect x="-13" y="-80" width="26" height="38" rx="4"/>
      <rect x="-13" y="-80" width="26" height="38" rx="4" transform="rotate(30)"/>
      <rect x="-13" y="-80" width="26" height="38" rx="4" transform="rotate(60)"/>
      <rect x="-13" y="-80" width="26" height="38" rx="4" transform="rotate(90)"/>
      <rect x="-13" y="-80" width="26" height="38" rx="4" transform="rotate(120)"/>
      <rect x="-13" y="-80" width="26" height="38" rx="4" transform="rotate(150)"/>
      <rect x="-13" y="-80" width="26" height="38" rx="4" transform="rotate(180)"/>
      <rect x="-13" y="-80" width="26" height="38" rx="4" transform="rotate(210)"/>
      <rect x="-13" y="-80" width="26" height="38" rx="4" transform="rotate(240)"/>
      <rect x="-13" y="-80" width="26" height="38" rx="4" transform="rotate(270)"/>
      <rect x="-13" y="-80" width="26" height="38" rx="4" transform="rotate(300)"/>
      <rect x="-13" y="-80" width="26" height="38" rx="4" transform="rotate(330)"/>
