name: Build & Publish Docker Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEPLOY_PATH: /home/flashvps/User-Guide

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure deploy dir + sync compose files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.yml,.env.example"
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true
          strip_components: 0

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GHCR_TOKEN,GHCR_USER,DEPLOY_PATH
          script: |
            set -e
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"

            if [ ! -f .env ]; then
              cp .env.example .env
              echo "Created $DEPLOY_PATH/.env from .env.example"
              echo "Edit SESSION_SECRET and APP_SECRET on the VPS, then re-run this workflow."
              exit 1
            fi

            # Perf defaults (không đụng SESSION/APP secret) — host 1 vCPU + adaptive
            if grep -qE '^SPEED=' .env; then
              sed -i 's/^SPEED=.*/SPEED=turbo/' .env
            else
              echo 'SPEED=turbo' >> .env
            fi
            if grep -qE '^DOCKER_CPU_LIVE=' .env; then
              sed -i 's/^DOCKER_CPU_LIVE=.*/DOCKER_CPU_LIVE=0.5/' .env
            else
              echo 'DOCKER_CPU_LIVE=0.5' >> .env
            fi
            if grep -qE '^DOCKER_CPU_MAX=' .env; then
              sed -i 's/^DOCKER_CPU_MAX=.*/DOCKER_CPU_MAX=1.0/' .env
            else
              echo 'DOCKER_CPU_MAX=1.0' >> .env
            fi
            if grep -qE '^ADAPTIVE_CAPACITY=' .env; then
              sed -i 's/^ADAPTIVE_CAPACITY=.*/ADAPTIVE_CAPACITY=true/' .env
            else
              echo 'ADAPTIVE_CAPACITY=true' >> .env
            fi
            if grep -qE '^ADAPTIVE_PEER_CONTAINER=' .env; then
              sed -i 's/^ADAPTIVE_PEER_CONTAINER=.*/ADAPTIVE_PEER_CONTAINER=mac-menu-engine/' .env
            else
              echo 'ADAPTIVE_PEER_CONTAINER=mac-menu-engine' >> .env
            fi
            if grep -qE '^CHROME_LIVE_MODE=' .env; then
              sed -i 's/^CHROME_LIVE_MODE=.*/CHROME_LIVE_MODE=snapshot/' .env
            else
              echo 'CHROME_LIVE_MODE=snapshot' >> .env
            fi
            if grep -qE '^LIVE_SNAPSHOT_MS=' .env; then
              sed -i 's/^LIVE_SNAPSHOT_MS=.*/LIVE_SNAPSHOT_MS=1500/' .env
            else
              echo 'LIVE_SNAPSHOT_MS=1500' >> .env
            fi

            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "${GHCR_USER:-$USER}" --password-stdin
            fi

            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
            docker compose ps
            docker image prune -f
